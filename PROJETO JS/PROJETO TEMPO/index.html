<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Tempo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <div class="card">
        <div class="pesquisa">
            <input type="text" id="cidade" placeholder="Digite o nome da cidade">
            <button id="buscar"><img src="css/imgs/search.png" alt="Buscar"></button>
        </div>
        <div class="clima">
            <img src="css/imgs/rain.png" alt="Ícone do clima" class="icone clima">
            <h1 class="tempo">25°C</h1>
            <h2 class="cidade">São Paulo</h2>
            <div class="detalhes">
                <div class="col">
                   <img src="css/imgs/humidity.png" alt="Ícone de umidade">
                   <p class="umidade">60%</p>
                   <h3>Umidade</h3>
                </div>
            </div>
             <div class="detalhes">
                <div class="col">
                   <img src="css/imgs/wind.png" alt="Ícone de vento">
                   <p class="vento">10 km/h</p>
                   <h3>Vento</h3>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
